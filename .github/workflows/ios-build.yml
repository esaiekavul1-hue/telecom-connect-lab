name: Build iOS - TELECOM CONNECT LAB

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances
        run: npm ci

      - name: Synchroniser Capacitor iOS
        run: npx cap sync ios

      - name: Compiler l'application iOS
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Enregistrer les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telecom-connect-lab-ios-build
          path: build/DerivedData/Build/Products/
          if-no-files-found: warn
          retention-days: 7
